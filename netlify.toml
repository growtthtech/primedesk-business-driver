# PrimeDesk deploy settings (repo root). Base = web/ subfolder.
[build]
  base = "web"
  command = "npm run build"
  publish = ".next"

# Next.js server routes (/api/*) run as functions automatically.
[[plugins]]
  package = "@netlify/plugin-nextjs"

# Never cache API responses.
[[headers]]
  for = "/api/*"
  [headers.values]
    Cache-Control = "no-store"

# Service worker must always revalidate, or phones get stuck on old app versions.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

# Manifest + icons change rarely; cache them for fast installs.
[[headers]]
  for = "/icons/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Cache-Control = "public, max-age=86400"
